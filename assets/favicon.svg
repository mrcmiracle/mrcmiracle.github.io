<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MRC Miracle">
  <!-- The seal, reduced to the parts that survive 16x16: disc, ring, star.
       The real seal carries two rings of text ("MRC MIRACLE", "KING COUNTY
       MRC") that turn into a purple smudge below about 48px, so the artwork
       itself is used at 96px and up (see icon-48/logo-96/apple-touch-icon)
       and this stands in at tab size.
       Fill is inverted from the printed seal - purple disc, white star, rather
       than white disc, purple star - because a white disc disappears into a
       light browser tab strip. The geometry is what makes it recognisable. -->
  <circle cx="32" cy="32" r="32" fill="#4f2b92"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".85"/>
  <path fill="#ffffff" d="M32 19 35.29 28.47 45.31 28.67 37.33 34.73 40.23 44.33 32 38.6 23.77 44.33 26.67 34.73 18.69 28.67 28.71 28.47Z"/>
</svg>
